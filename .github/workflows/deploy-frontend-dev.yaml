name: Deploy frontend dev

# Runs after a merge into main that touches frontend/, or by hand. Typecheck and
# unit tests run next to the image build. The arm64 image is built on a native
# arm64 runner (no QEMU) with the ECR registry cache, and the SEO check and the
# staged assets come from that immutable image, not from a separate build.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend-dev.yaml"
      - ".github/scripts/deploy-frontend.sh"
      - ".github/scripts/publish-frontend.sh"
      - ".github/scripts/smoke-frontend.sh"
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-frontend-dev
  cancel-in-progress: false

env:
  IMAGE_TAG: dev-sha-${{ github.sha }}

jobs:
  # These jobs hold no credentials and publish nothing, so they may use the npm
  # cache. The image installs its dependencies inside BuildKit.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Unit tests
        working-directory: frontend
        run: npm test

  image:
    name: Build image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      FRONTEND_ECR_REPOSITORY: ${{ vars.FRONTEND_ECR_REPOSITORY }}
      FRONTEND_ECR_CACHE: ${{ vars.FRONTEND_ECR_CACHE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: fantasm-frontend-dev
      - name: Check immutable image
        id: image
        run: |
          set -euo pipefail
          repo_name="${FRONTEND_ECR_REPOSITORY#*/}"
          if aws ecr describe-images --repository-name "$repo_name" --image-ids "imageTag=${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.image.outputs.exists != 'true'
      - name: Log in to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "${FRONTEND_ECR_REPOSITORY%%/*}"
      - name: Build and push immutable arm64 image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.FRONTEND_ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          build-args: VITE_SITE_URL=${{ env.VITE_SITE_URL }}
          cache-from: type=registry,ref=${{ env.FRONTEND_ECR_CACHE }}:buildcache-dev
          cache-to: type=registry,ref=${{ env.FRONTEND_ECR_CACHE }}:buildcache-dev,mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true,ignore-error=true
      - name: Extract the client build from the immutable image
        run: |
          set -euo pipefail
          docker pull "${FRONTEND_ECR_REPOSITORY}:${IMAGE_TAG}"
          container=$(docker create "${FRONTEND_ECR_REPOSITORY}:${IMAGE_TAG}")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/app/build/client" "$RUNNER_TEMP/frontend-client"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-client
          path: ${{ runner.temp }}/frontend-client
          retention-days: 1
          if-no-files-found: error

  seo:
    name: SEO check
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-client
          path: frontend/build/client
      - name: SEO check
        working-directory: frontend
        run: npm run check:seo

  deploy:
    name: Deploy dev
    needs: [typecheck, test, seo]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dev
    permissions:
      id-token: write
      contents: read
    outputs:
      site-url: ${{ env.SITE_URL }}
    env:
      FRONTEND_SSM_DEPLOY_DOCUMENT: ${{ vars.FRONTEND_SSM_DEPLOY_DOCUMENT }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      AWS_FRONTEND_BUCKET: ${{ vars.AWS_FRONTEND_BUCKET }}
      SITE_URL: ${{ vars.VITE_SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-client
          path: ${{ runner.temp }}/frontend-client
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: fantasm-frontend-dev
      - name: Stage immutable assets
        env:
          DIST: ${{ runner.temp }}/frontend-client
        run: bash .github/scripts/publish-frontend.sh
      - name: Deploy through SSM
        run: bash .github/scripts/deploy-frontend.sh "$IMAGE_TAG"

  smoke:
    name: Smoke test dev
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Smoke test through CloudFront
        env:
          SITE_URL: ${{ needs.deploy.outputs.site-url }}
        run: bash .github/scripts/smoke-frontend.sh "$SITE_URL"

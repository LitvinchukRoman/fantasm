name: Security backend

# gitleaks over everything outside frontend/, zizmor (workflows), govulncheck,
# CodeQL for Go, grype on the production image (CRITICAL with a fix fails).
# Runs nightly too: new CVEs appear for code that did not change. On a pull
# request it works only when something outside frontend/ changed.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Build with the toolchain go.mod asks for; never download another one silently.
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  security-backend:
    name: Security backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/changed.sh backend
      - name: Secrets (gitleaks)
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' }}
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --log-opts="-- . :(exclude)frontend" --redact --no-banner --verbose
      - name: Workflows (zizmor)
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GH_TOKEN -v "$PWD:/repo" -w /repo \
            ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101 \
            --min-severity medium --format plain .github
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' }}
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Only vulnerabilities the code can actually reach fail (call-graph analysis),
      # including the Go standard library.
      - name: Go vulnerabilities (govulncheck)
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' }}
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: CodeQL init
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' }}
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          build-mode: manual
          queries: security-extended
      - name: CodeQL build
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' }}
        working-directory: backend
        run: go build ./...
      - name: CodeQL analyze
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' }}
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:go
      # The Dockerfile cross-compiles, so the arm64 production image builds here
      # without QEMU. deploy-backend-dev builds and scans it again before pushing.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' }}
      - name: Build the production image
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/arm64
          load: true
          push: false
          provenance: false
          tags: fantasm-api:checks
          # Not the deploy's scope: it builds on arm64, and the build stage runs on
          # $BUILDPLATFORM, so sharing one scope only overwrites each other's cache.
          cache-from: type=gha,scope=fantasm-api-amd64
          cache-to: type=gha,scope=fantasm-api-amd64,mode=max,ignore-error=true
      # Fails on a CRITICAL vulnerability that has a fix; never on one that cannot
      # be patched yet. Exceptions go to backend/.grype.yaml with a reason.
      - name: Image vulnerabilities (grype)
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: fantasm-api:checks
          grype-version: v0.120.1
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table
          config: backend/.grype.yaml

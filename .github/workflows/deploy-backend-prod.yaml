name: Deploy backend prod

# Run by hand from main, no inputs. Prod gets the image dev built for the last
# commit that changed backend/; prod never rebuilds. The prod environment scopes
# credentials and only allows main.
#
# Rollback: re-run an older run of this workflow. It resolves the same commit,
# so it deploys the same image. Once promoted, an image also carries a
# release-<sha> alias that outlives ECR expiry; a release-<sha> image already
# ran on prod and skips the scan, so a new scanner rule never blocks a rollback.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: false

jobs:
  verify:
    name: Verify image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    environment: prod
    permissions:
      id-token: write
      contents: read
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    env:
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: fantasm-backend-prod
      - name: Resolve the image
        id: tag
        run: |
          set -euo pipefail
          commit=$(git log -1 --format=%H "$GITHUB_SHA" -- backend)
          repo_name="${ECR_REPOSITORY#*/}"
          tag=""
          for candidate in "sha-${commit}" "release-${commit}"; do
            if aws ecr describe-images --repository-name "$repo_name" --image-ids "imageTag=${candidate}" >/dev/null 2>&1; then
              tag="$candidate"
              break
            fi
          done
          [[ -n "$tag" ]] || { echo "::error::no image for ${commit} in ECR; deploy backend dev for that commit first"; exit 1; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Backend prod: \`${tag}\` (last backend/ commit at ${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"
      - name: Pull the image from ECR
        if: ${{ !startsWith(steps.tag.outputs.tag, 'release-') }}
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_REPOSITORY%%/*}"
          docker pull "${ECR_REPOSITORY}:${IMAGE_TAG}"
      # New CVEs appear after an image was built: scan the exact image again.
      - name: Scan the image again (grype, fail on CRITICAL)
        if: ${{ !startsWith(steps.tag.outputs.tag, 'release-') }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
          grype-version: v0.120.1
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table
          config: backend/.grype.yaml

  deploy:
    name: Deploy prod
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: prod
    permissions:
      id-token: write
      contents: read
    outputs:
      site-url: ${{ env.SITE_URL }}
    env:
      IMAGE_TAG: ${{ needs.verify.outputs.image-tag }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      SSM_DEPLOY_DOCUMENT: ${{ vars.SSM_DEPLOY_DOCUMENT }}
      SITE_URL: ${{ vars.VITE_SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: fantasm-backend-prod
      - name: Mark the image as released
        run: |
          set -euo pipefail
          repo_name="${ECR_REPOSITORY#*/}"
          manifest=$(aws ecr batch-get-image --repository-name "$repo_name" --image-ids "imageTag=${IMAGE_TAG}" --query 'images[0].imageManifest' --output text)
          if [[ -z "$manifest" || "$manifest" == "None" ]]; then
            echo "::error::${IMAGE_TAG} is not in ECR; deploy it to dev first"
            exit 1
          fi
          # A release-<sha> alias keeps the image from ECR expiry (rollback target).
          release_tag="release-${IMAGE_TAG#*-}"
          if [[ "$IMAGE_TAG" != release-* ]] && ! aws ecr describe-images --repository-name "$repo_name" --image-ids "imageTag=${release_tag}" >/dev/null 2>&1; then
            aws ecr put-image --repository-name "$repo_name" --image-tag "$release_tag" --image-manifest "$manifest" >/dev/null
          fi
      - name: Deploy through SSM
        run: bash .github/scripts/deploy-backend.sh "$IMAGE_TAG"

  smoke:
    name: Smoke test prod
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Smoke test through CloudFront
        env:
          SITE_URL: ${{ needs.deploy.outputs.site-url }}
        run: bash .github/scripts/smoke-api.sh "$SITE_URL"

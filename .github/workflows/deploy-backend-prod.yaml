name: Deploy backend prod

# A successful main-branch dev deployment automatically promotes the exact same
# image to prod. The prod environment scopes credentials and only allows main.
# Manual dispatch is retained only for an explicit deploy/rollback.
#
# Prod never rebuilds. A release-<sha> tag is an image prod already ran (a
# rollback) and skips the scan, so a newly published scanner rule can never
# block a rollback.

# workflow_run is safe here: "Deploy backend dev" runs only on push to main or
# by hand, this workflow checks out main (never the triggering ref) and runs
# only for a successful main-branch run.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["Deploy backend dev"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag from dev, e.g. sha-<commit> (release-<commit> to roll back)"
        type: string
        required: true

permissions: {}

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ github.event_name == 'workflow_run' && format('sha-{0}', github.event.workflow_run.head_sha) || inputs.image_tag }}

jobs:
  verify:
    name: Verify image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the tag
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^(sha|release)-[0-9a-f]{7,40}$ ]] || { echo "::error::image_tag must be sha-<commit> or release-<commit>"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: fantasm-backend-prod
      - name: Pull the image from ECR
        if: ${{ !startsWith(env.IMAGE_TAG, 'release-') }}
        run: |
          set -euo pipefail
          aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_REPOSITORY%%/*}"
          docker pull "${ECR_REPOSITORY}:${IMAGE_TAG}"
      # New CVEs appear after an image was built: scan the exact image again.
      - name: Scan the image again (grype, fail on CRITICAL)
        if: ${{ !startsWith(env.IMAGE_TAG, 'release-') }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          grype-version: v0.120.1
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table
          config: backend/.grype.yaml

  deploy:
    name: Deploy prod
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: prod
    permissions:
      id-token: write
      contents: read
    outputs:
      site-url: ${{ env.SITE_URL }}
    env:
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      SSM_DEPLOY_DOCUMENT: ${{ vars.SSM_DEPLOY_DOCUMENT }}
      SITE_URL: ${{ vars.VITE_SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: fantasm-backend-prod
      - name: Mark the image as released
        run: |
          set -euo pipefail
          repo_name="${ECR_REPOSITORY#*/}"
          manifest=$(aws ecr batch-get-image --repository-name "$repo_name" --image-ids "imageTag=${IMAGE_TAG}" --query 'images[0].imageManifest' --output text)
          if [[ -z "$manifest" || "$manifest" == "None" ]]; then
            echo "::error::${IMAGE_TAG} is not in ECR; deploy it to dev first"
            exit 1
          fi
          # A release-<sha> alias keeps the image from ECR expiry (rollback target).
          release_tag="release-${IMAGE_TAG#*-}"
          if [[ "$IMAGE_TAG" != release-* ]] && ! aws ecr describe-images --repository-name "$repo_name" --image-ids "imageTag=${release_tag}" >/dev/null 2>&1; then
            aws ecr put-image --repository-name "$repo_name" --image-tag "$release_tag" --image-manifest "$manifest" >/dev/null
          fi
      - name: Deploy through SSM
        run: bash .github/scripts/deploy-backend.sh "$IMAGE_TAG"

  smoke:
    name: Smoke test prod
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Smoke test through CloudFront
        env:
          SITE_URL: ${{ needs.deploy.outputs.site-url }}
        run: bash .github/scripts/smoke-api.sh "$SITE_URL"

name: Build backend

# go build and go test -race with Postgres, on arm64 (prod is Graviton; GitHub's
# arm64 runners are free for public repositories). Works only when something
# outside frontend/ changed.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Build with the toolchain go.mod asks for; never download another one silently.
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  build-backend:
    name: Build backend
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: fantasm
          POSTGRES_PASSWORD: fantasm
          POSTGRES_DB: fantasm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fantasm -d fantasm_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fantasm:fantasm@localhost:5432/fantasm_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/changed.sh backend
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' }}
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' }}
        working-directory: backend
        run: go build ./...
      - name: Tests
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' }}
        working-directory: backend
        run: go test -race -shuffle=on -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' }}
        working-directory: backend
        run: |
          {
            echo "### Backend coverage"
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

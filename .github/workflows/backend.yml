name: backend

# Gates (every one blocks the merge and the deploy):
#   backend-checks  gofmt, go mod tidy, go vet, golangci-lint (+gosec), govulncheck
#                   (reachable CVEs in code, deps and stdlib), hadolint (Dockerfile)
#   backend-test    go test -race on arm64 (prod is Graviton) against a real Postgres
#   backend-image   build the arm64 image, grype: fail on CRITICAL, SBOM
# deploy-dev pushes exactly the image that backend-image scanned.
# Runs nightly too: new CVEs appear for code that did not change.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Build with the toolchain go.mod asks for; never download another one silently.
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  backend-checks:
    name: backend-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        working-directory: backend
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "::error::gofmt -w needed on:"
            echo "$unformatted"
            exit 1
          fi
      - name: go.mod and go.sum are tidy
        if: ${{ !cancelled() }}
        working-directory: backend
        run: go mod tidy -diff
      - name: go vet
        if: ${{ !cancelled() }}
        working-directory: backend
        run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        if: ${{ !cancelled() }}
        with:
          version: v2.14.0
          working-directory: backend
      # Only vulnerabilities the code can actually reach fail the step (call-graph
      # analysis), so a CVE in an unused corner of a dependency does not block.
      # The Go standard library is included: an old toolchain fails here too.
      - name: govulncheck
        if: ${{ !cancelled() }}
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        if: ${{ !cancelled() }}
        with:
          dockerfile: backend/Dockerfile

  backend-test:
    name: backend-test
    # Production runs on Graviton (arm64), so the tests run there. GitHub's arm64
    # runners are free for public repositories.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: fantasm
          POSTGRES_PASSWORD: fantasm
          POSTGRES_DB: fantasm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fantasm -d fantasm_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fantasm:fantasm@localhost:5432/fantasm_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go test
        working-directory: backend
        run: go test -race -shuffle=on -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        working-directory: backend
        run: |
          {
            echo "### Coverage"
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Builds the production image (arm64, natively on an arm64 runner), scans it and
  # stores it as an artifact. No cloud credentials here: PRs from anywhere can run it.
  backend-image:
    name: backend-image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/arm64
          load: true
          push: false
          provenance: false
          tags: fantasm-api:ci
          cache-from: type=gha,scope=fantasm-api
          cache-to: type=gha,scope=fantasm-api,mode=max
      # Gate: any CRITICAL vulnerability with a fix available fails the job.
      # "only-fixed" keeps the gate actionable: it never blocks on something that
      # cannot be patched yet. Exceptions go to backend/.grype.yaml with a reason.
      - name: Grype scan (fail on CRITICAL)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: fantasm-api:ci
          grype-version: v0.120.1
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table
          config: backend/.grype.yaml
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: fantasm-api:ci
          format: spdx-json
          artifact-name: fantasm-api-sbom.spdx.json
          upload-release-assets: false
      - name: Save the scanned image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: docker save fantasm-api:ci --output /tmp/fantasm-api.tar
      - name: Upload the scanned image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fantasm-api-image
          path: /tmp/fantasm-api.tar
          retention-days: 1
          if-no-files-found: error

  # Pushes the image that backend-image scanned (not a rebuild) and deploys it to
  # dev. Prod is promoted by hand from the same tag (promote-prod.yml).
  deploy-dev:
    name: deploy-dev
    needs: [backend-checks, backend-test, backend-image]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE_TAG: sha-${{ github.sha }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      SSM_DEPLOY_DOCUMENT: ${{ vars.SSM_DEPLOY_DOCUMENT }}
      SITE_URL: ${{ vars.VITE_SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fantasm-api-image
          path: /tmp/image
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: fantasm-backend-dev
      - name: Push the scanned image to ECR
        run: |
          set -euo pipefail
          repo_name="${ECR_REPOSITORY#*/}"
          # Tags are immutable: a re-run of the same commit reuses the pushed image.
          if aws ecr describe-images --repository-name "$repo_name" --image-ids "imageTag=${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "image ${IMAGE_TAG} already in ECR, nothing to push"
            exit 0
          fi
          aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_REPOSITORY%%/*}"
          docker load --input /tmp/image/fantasm-api.tar
          docker tag fantasm-api:ci "${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REPOSITORY}:${IMAGE_TAG}"
      - name: Deploy to dev through SSM
        run: bash .github/scripts/deploy-backend.sh "$IMAGE_TAG"
      - name: Smoke test through CloudFront
        run: bash .github/scripts/smoke-api.sh "$SITE_URL"

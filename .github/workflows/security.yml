name: security

# Repository-wide gates. Backend code and image are scanned in backend.yml,
# static analysis (CodeQL) is in codeql.yml.
#   secrets            gitleaks over the whole git history
#   frontend-deps      npm audit: fail on CRITICAL, registry signatures verified
#   dependency-review  PR only: fail when the PR adds a CRITICAL dependency
#   workflow-audit     zizmor: injection, unpinned actions, excess permissions
#   node-runtime       nightly: .node-version is the newest patch of its line

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks-action needs a licence key for organisations and is a node
      # bundle; the official image pinned by digest does the same without both.
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --verbose

  frontend-deps:
    name: frontend-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --ignore-scripts: a compromised dependency cannot run code at install time.
      - run: npm ci --ignore-scripts
      - name: Registry signatures and provenance
        run: npm audit signatures
      - name: npm audit (fail on CRITICAL)
        run: npm audit --audit-level=critical
      # Not a gate: keeps HIGH findings visible in the log until they are fixed.
      - name: npm audit (HIGH and above, informational)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: critical
          comment-summary-in-pr: never

  workflow-audit:
    name: workflow-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GH_TOKEN -v "$PWD:/repo" -w /repo \
            ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101 \
            --min-severity medium --format plain .github

  # Dependabot cannot bump .node-version, so a scheduled run compares it with
  # the newest release of the same major line (security fixes land in patches).
  node-runtime:
    name: node-runtime
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: .node-version is the newest patch of its line
        run: |
          set -euo pipefail
          pinned="$(tr -d '[:space:]' < frontend/.node-version)"
          major="${pinned%%.*}"
          latest="$(curl -fsSL https://nodejs.org/dist/index.json \
            | jq -r --arg m "v${major}." '[.[] | select(.version | startswith($m))][0].version | ltrimstr("v")')"
          echo "pinned=${pinned} latest-${major}.x=${latest}"
          if [[ "$pinned" != "$latest" ]]; then
            echo "::error file=frontend/.node-version::Node ${pinned} is behind ${latest}. Update frontend/.node-version."
            exit 1
          fi

name: security

# Repository-wide gates in one job; a failing step does not hide the others.
# Backend code and image are scanned in backend.yml, static analysis (CodeQL)
# in codeql.yml (gated by the ruleset's "Code scanning results" rule).
#   gitleaks   secrets over the whole git history
#   npm        audit: fail on CRITICAL, registry signatures verified
#   zizmor     workflows: injection, unpinned actions, excess permissions
#   node       nightly: .node-version is the newest patch of its line
# Dependency review is not here: it needs the Dependency graph enabled in the
# repository settings (admin). Add it back after enabling it.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks-action needs a licence key for organisations and is a node
      # bundle; the official image pinned by digest does the same without both.
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --verbose
      - name: zizmor
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GH_TOKEN -v "$PWD:/repo" -w /repo \
            ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101 \
            --min-severity medium --format plain .github
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ !cancelled() }}
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --ignore-scripts: a compromised dependency cannot run code at install time.
      - name: npm ci
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: npm registry signatures and provenance
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm audit signatures
      - name: npm audit (fail on CRITICAL)
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm audit --audit-level=critical
      # Not a gate: keeps HIGH findings visible in the log until they are fixed.
      - name: npm audit (HIGH and above, informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      # Dependabot cannot bump .node-version, so a scheduled run compares it with
      # the newest release of the same major line (security fixes land in patches).
      - name: .node-version is the newest patch of its line
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: |
          set -euo pipefail
          pinned="$(tr -d '[:space:]' < frontend/.node-version)"
          major="${pinned%%.*}"
          latest="$(curl -fsSL https://nodejs.org/dist/index.json \
            | jq -r --arg m "v${major}." '[.[] | select(.version | startswith($m))][0].version | ltrimstr("v")')"
          echo "pinned=${pinned} latest-${major}.x=${latest}"
          if [[ "$pinned" != "$latest" ]]; then
            echo "::error file=frontend/.node-version::Node ${pinned} is behind ${latest}. Update frontend/.node-version."
            exit 1
          fi

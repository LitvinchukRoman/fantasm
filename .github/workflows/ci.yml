name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://fantasm.naukma.com' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check:seo

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  # Personal accounts cannot use the branch_name_pattern ruleset (enterprise only),
  # so the name is enforced here. Job name is the ruleset check context.
  branch-name:
    name: branch-name
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="${HEAD_REF:-$REF_NAME}"
          if [[ "$name" == "main" || "$name" == dependabot/* ]]; then
            echo "branch '$name' is allowed"
            exit 0
          fi
          pattern='^(feat|fix|chore|infra|docs)/[a-z0-9]+(-[a-z0-9]+)*$'
          if [[ ! "$name" =~ $pattern ]]; then
            echo "::error::branch '$name' must match $pattern"
            exit 1
          fi
          echo "branch '$name' matches"

  # main publishes to DEV only. Production is promoted by hand through
  # promote-prod.yml, so a merge can never change what prod serves.
  # The site URL is baked into the bundle, so dev is built here with the dev URL
  # (environment variable) instead of reusing the build job's artifact.
  deploy:
    name: deploy
    needs: [lint, typecheck, build, actionlint, branch-name]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build for dev
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: fantasm-frontend-dev
      - name: Publish to S3 and invalidate CloudFront
        env:
          AWS_FRONTEND_BUCKET: ${{ vars.AWS_FRONTEND_BUCKET }}
          AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
          DIST: frontend/build/client
        run: bash .github/scripts/publish-frontend.sh

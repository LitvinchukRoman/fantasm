name: Deploy frontend prod

# Manual only. The protected prod environment must require a reviewer.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-frontend-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and stage frontend prod
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      IMAGE_TAG: prod-sha-${{ github.sha }}
      FRONTEND_ECR_REPOSITORY: ${{ vars.FRONTEND_ECR_REPOSITORY }}
      FRONTEND_ECR_CACHE: ${{ vars.FRONTEND_ECR_CACHE }}
      FRONTEND_SSM_DEPLOY_DOCUMENT: ${{ vars.FRONTEND_SSM_DEPLOY_DOCUMENT }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      AWS_FRONTEND_BUCKET: ${{ vars.AWS_FRONTEND_BUCKET }}
      SITE_URL: ${{ vars.VITE_SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          # This job publishes a runtime image. Do not restore a PR-writable
          # package cache into a privileged artifact-producing job.
          package-manager-cache: false
      - name: Test and build
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm run build
          npm run check:seo
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: fantasm-frontend-prod
      - name: Check immutable image
        id: image
        run: |
          set -euo pipefail
          repo_name="${FRONTEND_ECR_REPOSITORY#*/}"
          if aws ecr describe-images --repository-name "$repo_name" --image-ids "imageTag=${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: steps.image.outputs.exists != 'true'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.image.outputs.exists != 'true'
      - name: Log in to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "${FRONTEND_ECR_REPOSITORY%%/*}"
      - name: Build and push immutable arm64 image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.FRONTEND_ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          build-args: VITE_SITE_URL=${{ env.VITE_SITE_URL }}
          cache-from: type=registry,ref=${{ env.FRONTEND_ECR_CACHE }}:buildcache-prod
          cache-to: type=registry,ref=${{ env.FRONTEND_ECR_CACHE }}:buildcache-prod,mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true
      - name: Extract assets from the immutable image
        run: |
          set -euo pipefail
          docker pull --platform linux/arm64 "${FRONTEND_ECR_REPOSITORY}:${IMAGE_TAG}"
          container=$(docker create --platform linux/arm64 "${FRONTEND_ECR_REPOSITORY}:${IMAGE_TAG}")
          trap 'docker rm "$container" >/dev/null' EXIT
          rm -rf /tmp/frontend-client
          mkdir -p /tmp/frontend-client
          docker cp "$container:/app/build/client/assets" /tmp/frontend-client/
      # Assets are safe to stage because names are content-hashed. HTML is not
      # uploaded, so prod's S3 default behavior remains live until cutover.
      - name: Stage immutable assets
        env:
          DIST: /tmp/frontend-client
        run: bash .github/scripts/publish-frontend.sh
      - name: Deploy through SSM
        run: bash .github/scripts/deploy-frontend.sh "$IMAGE_TAG"
      - name: Smoke test without switching prod
        run: bash .github/scripts/smoke-frontend.sh "$SITE_URL"

<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#08090a" />
    <title>Сторінку не знайдено, Fantasm</title>
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Onest, ui-sans-serif, system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #08090a;
        color: #edeef2;
      }
      main {
        max-width: 36rem;
        padding: 2rem;
        text-align: center;
      }
      p.mark {
        margin: 0;
        color: #ff6363;
        font-size: 4rem;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      h1 {
        margin: 1.5rem 0 0;
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p.copy {
        margin: 0.75rem auto 0;
        max-width: 28rem;
        color: #9ba1ac;
        font-size: 1.125rem;
        line-height: 1.5;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 2rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        border-radius: 12px;
        padding: 0.65rem 1.25rem;
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 500;
      }
      a.primary {
        background: #ff6363;
        color: #08090a;
      }
      a.secondary {
        border: 1px solid rgb(255 255 255 / 14%);
        color: #edeef2;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="mark" aria-hidden="true">404</p>
      <h1>Сторінку не знайдено</h1>
      <p class="copy">Можливо, посилання застаріло або ідею прибрав автор. Почніть зі стрічки чи гайдів.</p>
      <nav>
        <a class="primary" href="/">На головну</a>
        <a class="secondary" href="/ideas">Усі ідеї</a>
        <a class="secondary" href="/guides">Гайди</a>
      </nav>
    </main>
  </body>
</html>

services:
  fantasm-api:
    build: .
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ADDR: :8080
      DATABASE_URL: postgres://fantasm:fantasm@fantasm-postgres:5432/fantasm?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
      MIGRATE_ON_START: "true"
      ORGANIZATION_RULES_FILE: ${ORGANIZATION_RULES_FILE:-/app/config/organizations.json}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      APP_SECRET: ${APP_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      RATE_LIMIT_ANON_RPS: ${RATE_LIMIT_ANON_RPS:-10}
      RATE_LIMIT_ANON_BURST: ${RATE_LIMIT_ANON_BURST:-40}
      RATE_LIMIT_USER_RPS: ${RATE_LIMIT_USER_RPS:-20}
      RATE_LIMIT_USER_BURST: ${RATE_LIMIT_USER_BURST:-60}
      RATE_LIMIT_LOGIN_PER_MIN: ${RATE_LIMIT_LOGIN_PER_MIN:-20}
      RATE_LIMIT_POSTS_PER_MIN: ${RATE_LIMIT_POSTS_PER_MIN:-10}
      SESSION_IDLE_TTL: ${SESSION_IDLE_TTL:-168h}
      SESSION_ABSOLUTE_TTL: ${SESSION_ABSOLUTE_TTL:-720h}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
      DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-10s}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-15s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-20s}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-your-google-client-secret}

      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-your-entra-client-id}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-your-entra-client-secret}
    volumes:
      - ./config:/app/config:ro
    depends_on:
      fantasm-postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  fantasm-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fantasm
      POSTGRES_PASSWORD: fantasm
      POSTGRES_DB: fantasm
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fantasm -d fantasm" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

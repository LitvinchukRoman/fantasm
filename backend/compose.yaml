services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fantasm
      POSTGRES_PASSWORD: fantasm
      POSTGRES_DB: fantasm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasm -d fantasm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

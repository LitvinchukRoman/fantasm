        openReports: { type: integer }
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [COMMENT, VOTE, JOIN, ACCEPTED, APPROVED, HIDDEN, EVENT_REMINDER, SYSTEM] }
        payload:
          type: object
          additionalProperties: true
          description: Ids and short display strings only, for example `ideaSlug`, `ideaTitle`, `actorHandle`.
        read: { type: boolean }
        createdAt: { type: string, format: date-time }

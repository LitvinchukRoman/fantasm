groups:
  - name: fantasm
    rules:
      - alert: FantasmUnavailable
        expr: up{job="fantasm-api"} == 0 or fantasm_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Fantasm API is unavailable or initializing
      - alert: FantasmServerErrors
        expr: sum(rate(fantasm_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(fantasm_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of API requests fail with server errors
      - alert: FantasmSlowRequests
        expr: histogram_quantile(0.95, sum by (le) (rate(fantasm_http_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: API p95 latency exceeds one second
      - alert: FantasmJobFailures
        expr: time() - fantasm_job_last_failure_timestamp_seconds < 900
        labels:
          severity: warning
        annotations:
          summary: A background job failed
